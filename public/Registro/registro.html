<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Formulario de registro" />
    <title>Crear cuenta</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="signup-page">
      <section class="signup-card" aria-labelledby="auth-title">
        <h1 id="auth-title">CREAR CUENTA</h1>

        <form class="signup-form">
          <label class="signup-only" for="full-name">Nombre Completo</label>
          <input
            class="signup-only"
            id="full-name"
            name="fullName"
            type="text"
            autocomplete="name"
            required
          />

          <label class="signup-only" for="age">Edad</label>
          <input
            class="signup-only"
            id="age"
            name="age"
            type="number"
            inputmode="numeric"
            min="1"
            max="120"
            required
          />

          <label class="signup-only" for="country">País</label>
          <input
            class="signup-only"
            id="country"
            name="country"
            type="text"
            autocomplete="country-name"
            required
          />

          <label for="email">Correo</label>
          <input id="email" name="email" type="email" autocomplete="email" required />

          <label for="password">Contraseña</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="new-password"
            minlength="8"
            required
          />

          <label class="signup-only" for="username">Username</label>
          <input
            class="signup-only"
            id="username"
            name="username"
            type="text"
            autocomplete="username"
            required
          />

          <button class="submit-button" type="submit">REGISTRARSE</button>

          <p class="form-status" aria-live="polite"></p>
        </form>

        <button class="screen-toggle" type="button">INICIAR SESIÓN</button>
      </section>
    </main>

    <script>
      const form = document.querySelector(".signup-form");
      const status = document.querySelector(".form-status");
      const age = document.querySelector("#age");
      const password = document.querySelector("#password");
      const title = document.querySelector("#auth-title");
      const submitButton = document.querySelector(".submit-button");
      const screenToggle = document.querySelector(".screen-toggle");
      const signupOnlyElements = document.querySelectorAll(".signup-only");
      const signupOnlyInputs = document.querySelectorAll("input.signup-only");
      let isLogin = false;

      age.addEventListener("keydown", (event) => {
        if (["-", "+", "e", "E", "."].includes(event.key)) {
          event.preventDefault();
        }
      });

      age.addEventListener("input", () => {
        if (age.value === "") {
          return;
        }

        age.value = String(Math.min(120, Math.max(1, age.valueAsNumber)));
      });

      form.addEventListener("input", () => {
        status.textContent = "";
      });

      form.addEventListener("submit", (event) => {
        event.preventDefault();

        if (!form.checkValidity()) {
          form.reportValidity();
          return;
        }

        status.textContent = isLogin
          ? "Sesión iniciada correctamente."
          : "Registro completado correctamente.";
      });

      screenToggle.addEventListener("click", () => {
        isLogin = !isLogin;
        form.reset();
        status.textContent = "";

        signupOnlyElements.forEach((element) => {
          element.hidden = isLogin;
        });

        signupOnlyInputs.forEach((input) => {
          input.disabled = isLogin;
        });

        title.textContent = isLogin ? "INICIAR SESIÓN" : "CREAR CUENTA";
        submitButton.textContent = isLogin ? "INICIAR SESIÓN" : "REGISTRARSE";
        screenToggle.textContent = isLogin ? "CREAR CUENTA" : "INICIAR SESIÓN";
        password.autocomplete = isLogin ? "current-password" : "new-password";
      });
    </script>
  </body>
</html>
