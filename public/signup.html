<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Crea tu cuenta en CINEMASK.">
  <title>Sign up | CINEMASK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=Space+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="signup.css">
</head>
<body>
  <main class="signup-screen">
    <section class="signup-card" aria-labelledby="signup-title">
      <h1 class="signup-title" id="signup-title">SIGN UP</h1>

      <form class="signup-form" action="#" method="post">
        <div class="form-field">
          <label for="username">Nombre de Usuario</label>
          <input id="username" name="username" type="text" autocomplete="username" required>
        </div>

        <div class="form-field">
          <label for="nombre">Nombre</label>
          <input id="nombre" name="nombre" type="text" autocomplete="given-name" required>
        </div>

        <div class="form-field">
          <label for="edad">Edad</label>
          <input class="short-input" id="edad" name="edad" type="number" min="0" inputmode="numeric" required>
        </div>

        <div class="form-field">
          <label for="pais">País</label>
          <span class="select-wrap short-input">
            <select id="pais" name="pais" autocomplete="country-name" required>
              <option value="" disabled selected>Selecciona tu país</option>
              <option value="Argentina">Argentina</option>
              <option value="Chile">Chile</option>
              <option value="Colombia">Colombia</option>
              <option value="España">España</option>
              <option value="México">México</option>
              <option value="Perú">Perú</option>
              <option value="Otro">Otro</option>
            </select>
          </span>
        </div>

        <div class="form-field">
          <label for="correo">Correo</label>
          <input id="correo" name="correo" type="email" autocomplete="email" required>
        </div>

        <div class="form-field">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="new-password" required>
        </div>

        <button class="submit-button" type="submit">SIGN UP</button>
      </form>

      <a class="signin-link" href="index.html">Sign in</a>
    </section>
  </main>
</body>
</html>
