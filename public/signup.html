<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1e47">
  <title>Sign up | CINEMASK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=Space+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="signup.css">
</head>
<body>
  <main class="signup-screen">
    <section class="signup-card" aria-labelledby="signup-title">
      <h1 id="signup-title" class="signup-title">SIGN UP</h1>

      <form class="signup-form" action="#" method="post">
        <div class="form-field field-username">
          <label for="username">Nombre de Usuario</label>
          <input id="username" name="username" type="text" autocomplete="username" aria-label="Nombre de Usuario" required>
        </div>

        <div class="form-field field-email">
          <label for="email">Correo</label>
          <input id="email" name="email" type="email" autocomplete="email" aria-label="Correo" required>
        </div>

        <div class="form-field field-password">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="new-password" aria-label="Contraseña" required>
        </div>

        <button class="submit-button" type="submit">SIGN UP</button>
      </form>
    </section>
  </main>
</body>
</html>
