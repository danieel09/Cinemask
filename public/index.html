<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Inicia sesión en CINEMASK.">
  <title>Sign in | CINEMASK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=Space+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <main class="signin-screen">
    <section class="signin-card" aria-labelledby="signin-title">
      <h1 class="signin-title" id="signin-title">SIGN IN</h1>

      <form class="signin-form" action="#" method="post">
        <div class="form-field">
          <label for="correo">Correo</label>
          <input id="correo" name="correo" type="email" autocomplete="email" required placeholder="usuario@ejemplo.com">
        </div>

        <div class="form-field">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Contraseña">
        </div>

        <button class="submit-button" type="submit">Sing in</button>

        <p class="password-help">
          ¿Olvidaste tu contraseña?<br>
          <a href="correo.html" id="btnOlvidePassword">Actualizar contraseña</a>
        </p>
      </form>

      <div class="bottom-actions">
        <a class="guest-link" href="#" id="btnGuest">Invitado</a>
        <span class="actions-divider"></span>
        <a class="signup-link" href="signup.html">Sign up</a>
      </div>
    </section>
  </main>
</body>
<script src="/js/login.js"></script>
</html>
